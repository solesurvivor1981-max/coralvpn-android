name: Generate release keystore

# One-off: generate the app's PERMANENT signing keystore (no local Java available).
# Random passwords are generated inside the job (never in logs/inputs). The keystore +
# credentials are uploaded as a private artifact; the maintainer downloads them, stores
# them as repo secrets, and backs them up. Run once.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gen:
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Generate keystore
        run: |
          STOREPASS=$(openssl rand -hex 24)
          KEYPASS=$(openssl rand -hex 24)
          keytool -genkeypair -v \
            -keystore release.keystore -storetype PKCS12 \
            -alias coralvpn -keyalg RSA -keysize 4096 -validity 10000 \
            -storepass "$STOREPASS" -keypass "$KEYPASS" \
            -dname "CN=CoralVPN, O=AI Boost Tech, C=RU" >/dev/null 2>&1
          base64 -w0 release.keystore > keystore.b64
          {
            echo "ANDROID_KEY_ALIAS=coralvpn"
            echo "ANDROID_STORE_PASSWORD=$STOREPASS"
            echo "ANDROID_KEY_PASSWORD=$KEYPASS"
          } > creds.env
          echo "keystore + creds generated (values only in the artifact, not in logs)"

      - name: Upload keystore bundle
        uses: actions/upload-artifact@v4
        with:
          name: keystore-bundle
          path: |
            release.keystore
            keystore.b64
            creds.env
          if-no-files-found: error
          retention-days: 1
