name: Android CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch prebuilt libbox.aar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p app/libs
          gh release download libbox-v1.15.0-alpha.6 \
            --repo "${{ github.repository }}" \
            --pattern libbox.aar \
            --dir app/libs
          ls -la app/libs

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install SDK packages
        run: |
          yes | sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" > /dev/null

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Run unit tests
        run: |
          chmod +x ./gradlew
          ./gradlew :app:testDebugUnitTest --stacktrace --no-daemon

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: coralvpn-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
